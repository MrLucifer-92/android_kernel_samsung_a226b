name: Build A226b Kernel with KernelSU-Next
on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: 'Your kernel source repository URL'
        required: true
        type: string
        default: 'https://github.com/your-username/your-kernel-repo'
      kernel_branch:
        description: 'Kernel source branch'
        required: true
        type: string
        default: 'android-13'
      defconfig:
        description: 'Defconfig name (e.g., a226b_defconfig)'
        required: true
        type: string
        default: 'a226b_defconfig'
      enable_kernelsu:
        description: 'Enable KernelSU-Next patch'
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Install build dependencies
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git make bc bison flex libssl-dev cpio ccache
          sudo apt install -y git-lfs
          git lfs install

      # 2. Setup toolchains (Clang from AOSP + GCC for cross-compilation)
      - name: Setup toolchains
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc-arm64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc-arm32

      # 3. Checkout kernel source
      - name: Checkout kernel source
        run: |
          git clone --depth=1 -b ${{ github.event.inputs.kernel_branch }} ${{ github.event.inputs.kernel_source }} kernel-source
          cd kernel-source
          # Uncomment below if your kernel has submodules
          # git submodule update --init --recursive

      # 4. Integrate KernelSU-Next
      - name: Patch with KernelSU-Next
        if: ${{ github.event.inputs.enable_kernelsu == 'true' }}
        run: |
          cd kernel-source
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
          # Run the official integration script
          bash KernelSU/tools/init_kernelsu.sh .
          # Disable obsolete feature for older kernels (4.14 and below)
          echo "CONFIG_KSU_WITH_KPOBES=n" >> arch/arm64/configs/${{ github.event.inputs.defconfig }}

      # 5. Build the kernel
      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-arm64/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/gcc-arm32/bin/arm-linux-androideabi-
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/clang/lib:$LD_LIBRARY_PATH
          
          cd kernel-source
          # Generate defconfig
          make O=out ARCH=arm64 ${{ github.event.inputs.defconfig }}
          # Compile with Clang
          make O=out ARCH=arm64 -j$(nproc) CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi-
          
          echo "STATUS=$?" >> $GITHUB_ENV

      # 6. Package with AnyKernel3 for easy flashing
      - name: Package with AnyKernel3
        if: success()
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel
          cp kernel-source/out/arch/arm64/boot/Image anykernel/
          # If your device requires dtb/dtbo, copy them here:
          # cp kernel-source/out/arch/arm64/boot/dts/.../your.dtb anykernel/dtb
          cd anykernel
          zip -r9 A226b_KernelSU-Next_$(date +%Y%m%d_%H%M).zip * -x .git README.md

      # 7. Upload the final flashable ZIP
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A226b-Kernel-$(date +%Y%m%d)
          path: anykernel/*.zip
