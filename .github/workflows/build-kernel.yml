name: Build Kernel with KernelSU
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig name'
        required: true
        default: 'a22x_defconfig'
      kernelsu:
        description: 'Enable KernelSU?'
        required: true
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Set Up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git wget make bc flex bison gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Download Toolchain
      run: |
        mkdir -p toolchain
        cd toolchain
        git clone --depth=1 -b android11-release https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-4691093
        git clone --depth=1 -b master https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc-arm64
        git clone --depth=1 -b master https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc-arm32

    - name: Setup KernelSU
      if: github.event.inputs.kernelsu == 'true'
      run: |
        git clone --depth=1 https://github.com/tiann/KernelSU.git KernelSU
        echo "obj-\$(CONFIG_KSU) += KernelSU/" >> drivers/Makefile
        echo "source \"KernelSU/Kconfig\"" >> drivers/Kconfig
        echo "CONFIG_KPROBES=y" >> arch/arm64/configs/${{ github.event.inputs.defconfig }}
        echo "CONFIG_KSU=y" >> arch/arm64/configs/${{ github.event.inputs.defconfig }}

    - name: Build Kernel
      run: |
        export PATH=$PWD/toolchain/clang-4691093/bin:$PWD/toolchain/gcc-arm64/bin:$PWD/toolchain/gcc-arm32/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        export ARCH=arm64
        export SUBARCH=arm64
        make ${{ github.event.inputs.defconfig }}
        make -j$(nproc) CC=clang CLANG_TRIPLE=aarch64-linux-gnu- AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf OBJSIZE=llvm-size STRIP=llvm-strip

    - name: Package with AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        cp arch/arm64/boot/Image AnyKernel3/
        if [ -f arch/arm64/boot/dtbo.img ]; then cp arch/arm64/boot/dtbo.img AnyKernel3/; fi
        cd AnyKernel3
        zip -r9 ../kernel.zip * .zip

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel-flashable
        path: kernel.zip
